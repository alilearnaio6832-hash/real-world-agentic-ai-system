<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1250" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7FA3BD"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E8A33D"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5FBF8F"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="1250" fill="#0F1F38"/>

  <!-- title -->
  <text x="60" y="64" fill="#EAF2F6" font-size="34" font-weight="600" letter-spacing="0.3">Real-World Agentic AI System</text>
  <text x="60" y="94" fill="#7FA3BD" font-size="17">Execution architecture — verification and recovery built around a non-deterministic core</text>

  <!-- legend -->
  <g font-size="13" fill="#B9CCDC">
    <rect x="60" y="118" width="16" height="16" rx="3" fill="#E8A33D"/>
    <text x="84" y="130">LLM decision — non-deterministic</text>

    <rect x="330" y="118" width="16" height="16" rx="3" fill="#5FBF8F"/>
    <text x="354" y="130">Deterministic check / control</text>

    <rect x="600" y="118" width="16" height="16" rx="3" fill="#5A6E85"/>
    <text x="624" y="130">Infrastructure</text>
  </g>

  <line x1="60" y1="150" x2="1140" y2="150" stroke="#1F3759" stroke-width="1.5"/>

  <!-- User Task -->
  <rect x="470" y="178" width="260" height="56" rx="8" fill="#16304F" stroke="#5A6E85" stroke-width="1.5"/>
  <text x="600" y="211" fill="#EAF2F6" font-size="16" font-weight="600" text-anchor="middle">User Task</text>

  <line x1="600" y1="234" x2="600" y2="268" stroke="#7FA3BD" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Planner (optional) -->
  <rect x="380" y="270" width="440" height="78" rx="8" fill="#3A2B12" stroke="#E8A33D" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="600" y="298" fill="#F3D9A8" font-size="15" font-weight="600" text-anchor="middle">Planner.create_plan()  —  optional</text>
  <text x="600" y="319" fill="#C9A86B" font-size="12" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">app/agent/planning.py</text>
  <text x="600" y="339" fill="#C9A86B" font-size="12" text-anchor="middle">ordered steps; falls back to one step if parsing fails</text>

  <line x1="600" y1="348" x2="600" y2="378" stroke="#7FA3BD" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Execution Loop (amber, main) -->
  <rect x="330" y="380" width="540" height="150" rx="8" fill="#3A2B12" stroke="#E8A33D" stroke-width="1.5"/>
  <text x="600" y="410" fill="#F3D9A8" font-size="16" font-weight="600" text-anchor="middle">Execution Loop  —  run_with_tools()</text>
  <text x="600" y="430" fill="#C9A86B" font-size="12.5" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">LLM.generate_with_tools()  ·  bounded by max_iterations</text>

  <rect x="352" y="444" width="238" height="64" rx="6" fill="#2A1F0D" stroke="#9C7A3A" stroke-width="1"/>
  <text x="471" y="466" fill="#E8A33D" font-size="12.5" text-anchor="middle" font-weight="600">Empty response?</text>
  <text x="471" y="483" fill="#C9A86B" font-size="11.5" text-anchor="middle">retry once, then</text>
  <text x="471" y="498" fill="#C9A86B" font-size="11.5" text-anchor="middle">raise a controlled error</text>

  <rect x="610" y="444" width="238" height="64" rx="6" fill="#2A1F0D" stroke="#9C7A3A" stroke-width="1"/>
  <text x="729" y="466" fill="#E8A33D" font-size="12.5" text-anchor="middle" font-weight="600">Tool call requested?</text>
  <text x="729" y="483" fill="#C9A86B" font-size="11.5" text-anchor="middle">hand off to the</text>
  <text x="729" y="498" fill="#C9A86B" font-size="11.5" text-anchor="middle">Tool Registry  &#8594;</text>

  <!-- Tool Registry / Execution (green, right branch) -->
  <line x1="848" y1="476" x2="900" y2="452" stroke="#5FBF8F" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <rect x="902" y="420" width="238" height="64" rx="6" fill="#123A2C" stroke="#5FBF8F" stroke-width="1.5"/>
  <text x="1021" y="444" fill="#BCEBD4" font-size="13" text-anchor="middle" font-weight="600">Tool Registry</text>
  <text x="1021" y="462" fill="#7FBF9F" font-size="11.5" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">calculator · text_analyzer</text>

  <line x1="1021" y1="484" x2="1021" y2="500" stroke="#5FBF8F" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <rect x="902" y="502" width="238" height="64" rx="6" fill="#123A2C" stroke="#5FBF8F" stroke-width="1.5"/>
  <text x="1021" y="524" fill="#BCEBD4" font-size="13" text-anchor="middle" font-weight="600">Tool Execution</text>
  <text x="1021" y="542" fill="#7FBF9F" font-size="11" text-anchor="middle">transient failure &#8594; retried once</text>
  <text x="1021" y="557" fill="#7FBF9F" font-size="11" text-anchor="middle">before being reported</text>

  <!-- short feedback connector back into the loop -->
  <path d="M902,534 L878,534 L878,498 L872,498" fill="none" stroke="#5FBF8F" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowGreen)"/>
  <text x="885" y="590" fill="#7FBF9F" font-size="10.5" text-anchor="middle">observation</text>
  <text x="885" y="603" fill="#7FBF9F" font-size="10.5" text-anchor="middle">feeds back</text>
  <text x="885" y="616" fill="#7FBF9F" font-size="10.5" text-anchor="middle">into context</text>

  <line x1="600" y1="530" x2="600" y2="660" stroke="#7FA3BD" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="614" y="650" fill="#7FA3BD" font-size="12">no more tool calls</text>

  <!-- Verifier -->
  <rect x="340" y="662" width="520" height="104" rx="8" fill="#0F2E22" stroke="#5FBF8F" stroke-width="1.5"/>
  <text x="600" y="694" fill="#D9F3E6" font-size="16" font-weight="600" text-anchor="middle">Verifier.verify()  —  CalculatorVerifier</text>
  <text x="600" y="716" fill="#8FD6B4" font-size="12.5" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">app/agent/verification.py</text>
  <text x="600" y="738" fill="#8FD6B4" font-size="12.5" text-anchor="middle">parses the LLM's natural-language answer, checks it against the real computed result</text>
  <text x="600" y="756" fill="#5FBF8F" font-size="12" text-anchor="middle" font-style="italic">independent of how confident the LLM sounds</text>

  <!-- PASS branch -->
  <line x1="470" y1="766" x2="470" y2="810" stroke="#5FBF8F" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="488" y="795" fill="#5FBF8F" font-size="12.5" font-weight="600">PASS</text>
  <rect x="330" y="812" width="280" height="56" rx="8" fill="#16304F" stroke="#5A6E85" stroke-width="1.5"/>
  <text x="470" y="845" fill="#EAF2F6" font-size="14.5" font-weight="600" text-anchor="middle">VerifiedAgentResult</text>

  <!-- FAIL branch, routed around the left margin, clear of every box -->
  <text x="748" y="782" fill="#E8A33D" font-size="12.5" font-weight="600">FAIL</text>
  <path d="M730,766 L730,784 L150,784 L150,455 L328,455" fill="none" stroke="#E8A33D" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrowAmber)"/>
  <text x="240" y="443" fill="#E8A33D" font-size="12" text-anchor="middle" font-weight="600">run_with_recovery()</text>
  <text x="240" y="800" fill="#C9A86B" font-size="11" text-anchor="middle">feedback + full attempt history injected into next retry</text>

  <!-- ExecutionState side panel -->
  <rect x="890" y="170" width="270" height="180" rx="8" fill="#16304F" stroke="#5A6E85" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="1025" y="198" fill="#EAF2F6" font-size="14.5" font-weight="600" text-anchor="middle">ExecutionState</text>
  <text x="1025" y="216" fill="#7FA3BD" font-size="11.5" text-anchor="middle">attached to every result</text>
  <g font-size="12" fill="#B9CCDC" font-family="ui-monospace, Menlo, Consolas, monospace">
    <text x="910" y="238">iterations</text>
    <text x="910" y="258">tool_calls_made</text>
    <text x="910" y="278">tool_retries</text>
    <text x="910" y="298">empty_response_retries</text>
    <text x="910" y="318">retries</text>
    <text x="910" y="338">elapsed_seconds · total_tokens</text>
  </g>

  <!-- Deployment wrapper -->
  <line x1="470" y1="868" x2="470" y2="920" stroke="#7FA3BD" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="260" y="922" width="680" height="220" rx="10" fill="#101E33" stroke="#5A6E85" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="600" y="954" fill="#B9CCDC" font-size="14" font-weight="600" text-anchor="middle">Docker container  —  python:3.11-slim</text>

  <rect x="300" y="974" width="600" height="100" rx="8" fill="#16304F" stroke="#5A6E85" stroke-width="1.5"/>
  <text x="600" y="1002" fill="#EAF2F6" font-size="15" font-weight="600" text-anchor="middle">FastAPI  —  app/api.py</text>
  <text x="600" y="1024" fill="#7FA3BD" font-size="12.5" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">POST /run</text>
  <text x="600" y="1044" fill="#7FA3BD" font-size="12.5" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">GET /health</text>

  <text x="600" y="1105" fill="#7FA3BD" font-size="11.5" text-anchor="middle">container reaches the host via host.docker.internal</text>

  <line x1="940" y1="1024" x2="1020" y2="1024" stroke="#7FA3BD" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1022" y="992" width="140" height="64" rx="8" fill="#16304F" stroke="#5A6E85" stroke-width="1.5"/>
  <text x="1092" y="1018" fill="#EAF2F6" font-size="13" font-weight="600" text-anchor="middle">Ollama</text>
  <text x="1092" y="1036" fill="#7FA3BD" font-size="10.5" text-anchor="middle">host machine</text>
  <text x="1092" y="1048" fill="#7FA3BD" font-size="10.5" text-anchor="middle">not containerized</text>

  <!-- footer -->
  <line x1="60" y1="1190" x2="1140" y2="1190" stroke="#1F3759" stroke-width="1.5"/>
  <text x="60" y="1220" fill="#7FA3BD" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace">github.com/alilearnaio6832-hash/real-world-agentic-ai-system</text>
  <text x="1140" y="1220" fill="#5A6E85" font-size="13" text-anchor="end">v1.0.0</text>
</svg>
